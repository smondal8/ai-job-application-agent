<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In - Workday Candidate Portal</title>
</head>
<body>
  <div data-automation-id="signInPage" class="workday-auth-container">
    <h2>Sign In to Your Workday Account</h2>
    <form action="/login" method="POST">
      <label>Email Address</label>
      <input type="email" data-automation-id="email" name="username" required>

      <label>Password</label>
      <input type="password" data-automation-id="password" name="password" required>

      <button type="submit" data-automation-id="signInSubmitButton">
        Sign In
      </button>
    </form>
  </div>
</body>
</html>
