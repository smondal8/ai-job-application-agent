<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Workday Job Application Demo</title>
</head>
<body>
  <div class="workday-app-container">
    <h1>Staff Systems Architect - Workday Jobs</h1>
    <form id="workday_apply_form" action="/apply" method="POST">
      <label>Legal First Name *</label>
      <input type="text" data-automation-id="legalNameSection_firstName" name="firstName" required>

      <label>Legal Last Name *</label>
      <input type="text" data-automation-id="legalNameSection_lastName" name="lastName" required>

      <label>Email Address *</label>
      <input type="email" data-automation-id="email" name="email" required>

      <label>Phone Number</label>
      <input type="tel" data-automation-id="phone-number" name="phone">

      <label>City / Location</label>
      <input type="text" data-automation-id="addressSection_city" name="city">

      <label>Resume / CV *</label>
      <input type="file" data-automation-id="file-upload-input" name="resume" required>

      <button type="submit" data-automation-id="bottom-navigation-next-button" class="workday-submit-btn">
        Submit Application
      </button>
    </form>
  </div>
</body>
</html>
