<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDF Only Application Portal Demo</title>
</head>
<body>
  <div id="application-container">
    <h1>Software Engineering Manager - Application</h1>
    <form id="application_form" action="/apply" method="POST" enctype="multipart/form-data">
      <div class="form-group">
        <label for="first_name">First Name *</label>
        <input type="text" id="first_name" name="first_name" required>
      </div>
      <div class="form-group">
        <label for="last_name">Last Name *</label>
        <input type="text" id="last_name" name="last_name" required>
      </div>
      <div class="form-group">
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="resume">Resume / CV (PDF Only) *</label>
        <input type="file" id="resume" name="resume" accept=".pdf,application/pdf" required>
      </div>
      <button type="submit" id="submit_app" class="submit-btn">Submit Application</button>
    </form>
  </div>
</body>
</html>
